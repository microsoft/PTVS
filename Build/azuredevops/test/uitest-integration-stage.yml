parameters:
  - name: BinariesDirectory
    type: string
    default: '$(Drop)/binaries'
  - name: CleanupProcesses
    type: string
    default: 'devenv, vshub, microsoft.vshub.server.httphost, python, ipy, microsoft.pythontools.analyzer, vstest.executionengine.x86, vstest.discoveryengine.x86'
  - name: Drop
    type: string
    default: '$(System.ArtifactsDirectory)/$(DefinitionName)'
  - name: MinimumExpectedTests
    type: number
    default: 123
  - name: ResultsDirectory
    type: string
    default: '$(Agent.TempDirectory)/P0UITestResults'
  - name: RunSettingsFile
    type: string
    default: '$(Drop)/p0.runsettings'
  - name: TestFilterCriteria
    type: string
    default: 'Priority=0'
  - name: UITestNames
    type: string
    default: ''
  - name: VisualStudioInstallationPath
    type: string
    default: 'C:\Test\VisualStudio'

steps:
  - task: ExtractFiles@1
    displayName: Extract files
    condition: succeeded()
    inputs:
      archiveFilePatterns: '${{ parameters.Drop }}/TestData/TestData.zip'
      destinationFolder: '${{ parameters.Drop }}/TestData'
      cleanDestinationFolder: false
      overwriteExistingFiles: false

  - task: PowerShell@2
    displayName: Cleanup
    condition: succeeded()
    continueOnError: true
    timeoutInMinutes: 5
    inputs:
      targetType: inline
      script: |
        $names = @(
          '${{ parameters.CleanupProcesses }}' -split ',' |
            ForEach-Object { $_.Trim() } |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
        )
        $running = Get-Process -Name $names -ErrorAction SilentlyContinue
        while ($running) {
          Write-Host 'Killing:'
          $running
          try {
            $running | Stop-Process -Force
          } catch {
          }
          Start-Sleep -Seconds 3
          $running = Get-Process -Name $names -ErrorAction SilentlyContinue
        }
      errorActionPreference: stop
      failOnStderr: true

  - task: CopyFiles@2
    displayName: Copy TestData into binaries
    condition: succeeded()
    inputs:
      SourceFolder: '${{ parameters.Drop }}/TestData'
      Contents: '**'
      TargetFolder: '${{ parameters.BinariesDirectory }}/TestData'
      CleanTargetFolder: 'true'
      OverWrite: 'false'
      flattenFolders: 'false'
      preserveTimestamp: 'false'
      retryCount: '0'

  - task: PowerShell@2
    displayName: Skip Verification
    condition: succeeded()
    inputs:
      targetType: inline
      script: |
        $ErrorActionPreference = 'Stop'
        $registryFile = '${{ parameters.BinariesDirectory }}\TestData\EnableSkipVerification.reg'
        if (-not (Test-Path -LiteralPath $registryFile -PathType Leaf)) {
          throw "Skip-verification registry file not found: $registryFile"
        }
        reg import "$registryFile"
        if ($LASTEXITCODE -ne 0) {
          throw "reg import failed with exit code $LASTEXITCODE for '$registryFile'."
        }
      errorActionPreference: stop
      failOnStderr: false

  - task: PowerShell@2
    displayName: Validate P0 UI test inputs
    condition: succeeded()
    inputs:
      targetType: inline
      script: |
        $ErrorActionPreference = 'Stop'

        $assembly = '${{ parameters.BinariesDirectory }}\${{ parameters.UITestNames }}UITestsRunner.dll'
        $runSettings = '${{ parameters.RunSettingsFile }}'
        $visualStudio = '${{ parameters.VisualStudioInstallationPath }}\Common7\IDE\devenv.exe'
        $results = '${{ parameters.ResultsDirectory }}'

        foreach ($requiredFile in @($assembly, $runSettings, $visualStudio)) {
          if (-not (Test-Path -LiteralPath $requiredFile -PathType Leaf)) {
            throw "Required P0 UI test input not found: $requiredFile"
          }
        }

        if (Test-Path -LiteralPath $results) {
          Remove-Item -LiteralPath $results -Recurse -Force
        }
        New-Item -ItemType Directory -Force -Path $results | Out-Null
        Write-Host '##vso[task.setvariable variable=P0_UI_INPUTS_READY]true'
      errorActionPreference: stop
      failOnStderr: false

  - task: VSTest@3
    displayName: '[MultiConfiguration] Run UI Test ${{ parameters.UITestNames }}'
    condition: succeeded()
    inputs:
      testSelector: testAssemblies
      testAssemblyVer2: '${{ parameters.UITestNames }}UITestsRunner.dll'
      searchFolder: '${{ parameters.BinariesDirectory }}'
      resultsFolder: '${{ parameters.ResultsDirectory }}'
      testFiltercriteria: '${{ parameters.TestFilterCriteria }}'
      runOnlyImpactedTests: false
      runAllTestsAfterXBuilds: 50
      uiTests: true
      vstestLocationMethod: version
      vsTestVersion: latest
      runSettingsFile: '${{ parameters.RunSettingsFile }}'
      runInParallel: false
      runTestsInIsolation: false
      codeCoverageEnabled: false
      distributionBatchType: basedOnExecutionTime
      batchingBasedOnAgentsOption: autoBatchSize
      customBatchSizeValue: 10
      batchingBasedOnExecutionTimeOption: customTimeBatchSize
      customRunTimePerBatchValue: 300
      dontDistribute: false
      testRunTitle: '${{ parameters.UITestNames }} UI Tests'
      publishRunAttachments: true
      failOnMinTestsNotRun: true
      minimumExpectedTests: ${{ parameters.MinimumExpectedTests }}
      diagnosticsEnabled: true
      collectDumpOn: onAbortOnly
      rerunFailedTests: false
    env:
      _TESTDATA_ROOT_PATH: '${{ parameters.BinariesDirectory }}'
      _TESTDATA_NO_ROOTSUFFIX: '1'
      VisualStudio_IDE: '${{ parameters.VisualStudioInstallationPath }}\Common7\IDE'
      VSAPPIDDIR: '${{ parameters.VisualStudioInstallationPath }}\Common7\IDE'
      VSINSTALLDIR: '${{ parameters.VisualStudioInstallationPath }}'

  - task: PowerShell@2
    displayName: Validate P0 UI test results
    condition: and(always(), eq(variables['P0_UI_INPUTS_READY'], 'true'))
    inputs:
      targetType: filePath
      filePath: '$(Build.SourcesDirectory)\Build\ValidateTestResults.ps1'
      arguments: >
        -ResultsPath "${{ parameters.ResultsDirectory }}"
        -MinimumExpectedTests ${{ parameters.MinimumExpectedTests }}
        -TestRunName "${{ parameters.UITestNames }} P0 UI tests"

  - task: PowerShell@2
    displayName: Cleanup
    condition: always()
    continueOnError: true
    timeoutInMinutes: 5
    inputs:
      targetType: inline
      script: |
        $names = @(
          '${{ parameters.CleanupProcesses }}' -split ',' |
            ForEach-Object { $_.Trim() } |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
        )
        $running = Get-Process -Name $names -ErrorAction SilentlyContinue
        while ($running) {
          Write-Host 'Killing:'
          $running
          try {
            $running | Stop-Process -Force
          } catch {
          }
          Start-Sleep -Seconds 3
          $running = Get-Process -Name $names -ErrorAction SilentlyContinue
        }
      errorActionPreference: stop
      failOnStderr: true
