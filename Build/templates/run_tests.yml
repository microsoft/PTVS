parameters:
- name: refreshGlassCache
  type: boolean
  default: false
- name: glassCacheVersion
  type: string
  default: v3

steps:
  # Glass test setup scripts invoke pip; keep those downloads on the internal feed.
  - task: PipAuthenticate@1
    displayName: 'Pip Authenticate'
    inputs:
      artifactFeeds: 'DevDiv/Pylance_PublicPackages'
      onlyAddExtraIndex: false

  # Install different python versions
  - template: ./install_python.yml
    parameters:
      pythonVersion: '3.9.13' # Last version with an installer
  - template: ./install_python.yml
    parameters:
      pythonVersion: '3.10.11' # Last version with an installer
  - template: ./install_python.yml
    parameters:
      pythonVersion: '3.11.9' # Last version with an installer
  - template: ./install_python.yml
    parameters:
      pythonVersion: '3.12.7'
      outputVar: InstallPython312
  - template: ./install_python.yml
    parameters:
      pythonVersion: '3.13.0'
  
  # Find the environment variable for the install of 3.12
  - powershell: |
      $suffix = '_INSTALLPYTHON312'
      $envVars = Get-ChildItem Env:

      foreach ($envVar in $envVars) {
        if ($envVar.Name.EndsWith($suffix)) {
          echo "##vso[task.setvariable variable=PYTHON_INTERPRETER]$($envVar.Value)\python.exe"
          break
        }
      }  
    displayName: 'Set PYTHON_INTERPRETER variable'

  - task: PythonScript@0
    displayName: 'Test python path'
    env:
      SYSTEM_ACCESSTOKEN: $(DropToken)
    inputs:
      scriptSource: 'inline' # 'filePath' | 'inline'. Required. Script source. Default: filePath.
      script: |
        import sys
        print(sys.executable)
        print(sys.version)
        print(sys.path)
      workingDirectory: $(Build.SourcesDirectory)
      failOnStderr: true
      pythonInterpreter: $(PYTHON_INTERPRETER)

  # Download binaries from the build job instead of rebuilding
  - download: current
    artifact: Binaries
    displayName: 'Download build binaries'

  # Copy downloaded binaries to the expected location
  - powershell: |
      $source = '$(Pipeline.Workspace)\Binaries'
      $dest = '$(Build.BinariesDirectory)\raw\binaries'
      New-Item -ItemType Directory -Force -Path $dest | Out-Null
      Copy-Item -Path "$source\*" -Destination $dest -Recurse -Force
    displayName: 'Copy binaries to expected location'

  - powershell: |
      Write-Host "Agent.Name=$env:AGENT_NAME"
      Write-Host "Agent.Version=$env:AGENT_VERSION"
      Write-Host "Agent.OS=$env:AGENT_OS"
      Write-Host "Image=$env:IMAGE"
      Write-Host "Image.Version=$env:IMAGE_VERSION"
      Write-Host "OS=$([System.Environment]::OSVersion.VersionString)"
      Write-Host "PowerShell=$($PSVersionTable.PSVersion)"

      $tar = Get-Command tar.exe -ErrorAction Stop
      Write-Host "tar path: $($tar.Source)"
      & $tar.Source '--version' 2>&1 | ForEach-Object { Write-Host $_ }

      $cacheTemp = '$(Pipeline.Workspace)\GlassCacheTemp'
      New-Item -ItemType Directory -Force -Path $cacheTemp | Out-Null
      Write-Host "Cache temp path: $cacheTemp"
      Get-PSDrive -Name ([System.IO.Path]::GetPathRoot($cacheTemp).TrimEnd('\').TrimEnd(':')) |
        ForEach-Object { Write-Host "Cache drive free space: $($_.Free) bytes" }
    displayName: 'Log Glass cache archive tools'

  - task: Cache@2
    displayName: 'Restore glass binaries from cache'
    condition: and(eq('${{ parameters.refreshGlassCache }}', 'false'), ne(variables['System.PullRequest.IsFork'], 'True'))
    inputs:
      # Pipeline caches are immutable. Bump the version when an existing cache cannot be restored.
      key: '"glass" | "${{ parameters.glassCacheVersion }}" | Build/setup_glass.py'
      path: '$(Pipeline.Workspace)\GlassCacheArchive'
      cacheHitVar: 'CACHE_RESTORED'
    env:
      TEMP: $(Pipeline.Workspace)\GlassCacheTemp
      TMP: $(Pipeline.Workspace)\GlassCacheTemp

  - powershell: |
      $archive = '$(Pipeline.Workspace)\GlassCacheArchive\GlassTests.tar.gz'
      $dest = '$(Build.SourcesDirectory)\GlassTests'

      if (-not (Test-Path -LiteralPath $archive)) {
        throw "Glass cache archive not found at '$archive'."
      }

      if (Test-Path -LiteralPath $dest) {
        Remove-Item -LiteralPath $dest -Recurse -Force
      }

      New-Item -ItemType Directory -Force -Path $dest | Out-Null
      $tar = (Get-Command tar.exe -ErrorAction Stop).Source
      & $tar -xzf $archive -C $dest
      if ($LASTEXITCODE -ne 0) {
        throw "Extracting the Glass cache archive failed with exit code $LASTEXITCODE."
      }
    displayName: 'Restore Glass runtime from cache archive'
    condition: and(succeeded(), in(variables['CACHE_RESTORED'], 'true', 'inexact'))

  - powershell: |
      $isForkPr = '$(System.PullRequest.IsFork)' -eq 'True'
      $refreshGlassCache = '${{ parameters.refreshGlassCache }}' -eq 'true'
      $cacheState = '$(CACHE_RESTORED)'
      $cacheRestored = $cacheState -eq 'true' -or $cacheState -eq 'inexact'
      $requiredGlassFiles = @(
        '$(Build.SourcesDirectory)\GlassTests\vstest.console.exe',
        '$(Build.SourcesDirectory)\GlassTests\PythonTests\PythonConcord.GlassTestRoot',
        '$(Build.SourcesDirectory)\GlassTests\PythonTests\PythonEngine.regdef'
      )
      $cacheUsable = $cacheRestored
      foreach ($requiredGlassFile in $requiredGlassFiles) {
        if (-not (Test-Path -LiteralPath $requiredGlassFile)) {
          $cacheUsable = $false
          break
        }
      }

      if ($cacheRestored -and -not $cacheUsable) {
        Write-Warning "GlassTests cache was restored, but required Glass files are missing. Treating the cache as a miss."
      }

      $setupGlass = -not $isForkPr -and ($refreshGlassCache -or -not $cacheUsable)
      $runGlass = $cacheUsable -or $setupGlass
      $skipGlassOnForkCacheMiss = $isForkPr -and -not $cacheUsable -and -not $refreshGlassCache

      Write-Host "CACHE_RESTORED=$cacheState"
      Write-Host "GLASS_CACHE_USABLE=$($cacheUsable.ToString().ToLowerInvariant())"
      Write-Host "##vso[task.setvariable variable=SETUP_GLASS]$($setupGlass.ToString().ToLowerInvariant())"
      Write-Host "##vso[task.setvariable variable=RUN_GLASS]$($runGlass.ToString().ToLowerInvariant())"
      Write-Host "##vso[task.setvariable variable=SKIP_GLASS_ON_FORK_CACHE_MISS]$($skipGlassOnForkCacheMiss.ToString().ToLowerInvariant())"
    displayName: 'Set Glass test conditions'

  - task: AzureCLI@2
    displayName: 'Acquire an AAD token from a User-Assigned Managed Identity and save it as secret variable DropToken'
    condition: and(succeeded(), eq(variables['SETUP_GLASS'], 'true'))
    inputs:
      azureSubscription: 'PylanceSecureVsIdePublishWithManagedIdentity'
      scriptType: 'pscore'
      scriptLocation: 'inlineScript'
      inlineScript: |
        # if this fails, check out this bash script that includes diagnostics:
        # https://gist.github.com/johnterickson/19f80a3e969e39f1000d118739176e62
        
        # Note that the resoruce is specified to limit the token to Azure DevOps
        $token = az account get-access-token --query accessToken --resource 499b84ac-1321-427f-aa17-267ca6975798 -o tsv
        Write-Host "##vso[task.setvariable variable=DropToken;issecret=true]$token"      

  # Setup the glass test folder
  - task: PythonScript@0
    displayName: 'Setup glass test folder'
    condition: and(succeeded(), eq(variables['SETUP_GLASS'], 'true'))
    env:
      SYSTEM_ACCESSTOKEN: $(DropToken)
    inputs:
      scriptSource: 'filePath' # 'filePath' | 'inline'. Required. Script source. Default: filePath.
      scriptPath: $(Build.SourcesDirectory)/Build/setup_glass.py
      arguments: '--authTokenVariable SYSTEM_ACCESSTOKEN --buildOutput $(Build.BinariesDirectory)\raw\binaries'
      workingDirectory: $(Build.SourcesDirectory)
      failOnStderr: true
      pythonInterpreter: $(PYTHON_INTERPRETER)

  - powershell: |
      $source = '$(Build.SourcesDirectory)\GlassTests'
      $dest = '$(Pipeline.Workspace)\GlassCacheArchive'
      $archive = Join-Path $dest 'GlassTests.tar.gz'

      if (Test-Path -LiteralPath $dest) {
        Remove-Item -LiteralPath $dest -Recurse -Force
      }

      New-Item -ItemType Directory -Force -Path $dest | Out-Null
      $files = @(Get-ChildItem -LiteralPath $source -Recurse -File -Force -ErrorAction Stop)
      $sourceSize = ($files | Measure-Object -Property Length -Sum).Sum
      Write-Host "Glass cache source: $($files.Count) files, $sourceSize bytes"

      $tar = (Get-Command tar.exe -ErrorAction Stop).Source
      & $tar -czf $archive -C $source .
      if ($LASTEXITCODE -ne 0) {
        throw "Creating the Glass cache archive failed with exit code $LASTEXITCODE."
      }

      $archiveSize = (Get-Item -LiteralPath $archive).Length
      Write-Host "Glass cache archive: $archive ($archiveSize bytes)"
    displayName: 'Prepare Glass cache archive'
    condition: and(succeeded(), eq(variables['SETUP_GLASS'], 'true'))

  # A normal cache miss is saved by the restore task's built-in post-job step.
  # Explicit refresh skips that restore task, so it needs a cache task of its own.
  - task: Cache@2
    displayName: 'Cache refreshed glass binaries'
    condition: and(succeeded(), eq(variables['SETUP_GLASS'], 'true'), eq('${{ parameters.refreshGlassCache }}', 'true'))
    inputs:
      key: '"glass" | "${{ parameters.glassCacheVersion }}" | Build/setup_glass.py'
      path: '$(Pipeline.Workspace)\GlassCacheArchive'
    env:
      TEMP: $(Pipeline.Workspace)\GlassCacheTemp
      TMP: $(Pipeline.Workspace)\GlassCacheTemp

  - powershell: |
      Write-Warning "GlassTests cache restore is disabled for fork PRs to prevent Cache@2 post-job cache writes, and fork PRs cannot run setup_glass.py because the internal DevDiv drop token is unavailable. Skipping Glass tests for this validation. A trusted main/release build can refresh the 'glass' cache."
    displayName: 'Skip Glass tests on fork cache miss'
    condition: and(succeeded(), eq(variables['SKIP_GLASS_ON_FORK_CACHE_MISS'], 'true'))

  # Run the glass tests
  - task: PythonScript@0
    displayName: 'Run Glass tests'
    condition: and(succeeded(), eq(variables['RUN_GLASS'], 'true'))
    inputs:
      scriptSource: 'filePath' # 'filePath' | 'inline'. Required. Script source. Default: filePath.
      scriptPath: $(Build.SourcesDirectory)/Build/run_glass.py
      arguments: '--buildOutput $(Build.BinariesDirectory)\raw\binaries'
      workingDirectory: $(Build.SourcesDirectory)
      failOnStderr: true
      pythonInterpreter: $(PYTHON_INTERPRETER)

  # Upload the trx file as a test result
  - task: PublishTestResults@2
    condition: and(always(), eq(variables['RUN_GLASS'], 'true'))
    displayName: 'Publish Glass test results'
    inputs:
      testResultsFiles: '$(Build.SourcesDirectory)/TestResults/*.trx'
      testRunTitle: 'Glass Tests'
      testResultsFormat: 'VSTest'
      failTaskOnFailedTests: true
