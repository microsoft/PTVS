parameters:
- name: ptvsPackageVersion
  type: string
  default: $(Build.BuildNumber)

steps:

  # Build the product
  - task: MSBuild@1
    displayName: 'Build product'
    inputs:
      solution: $(Build.SourcesDirectory)/Python/Product/dirs.proj
      msbuildVersion: $(MsBuildVersion)
      platform: $(Platform)
      configuration: $(BuildConfiguration)
      msbuildArguments: ' /p:VSTarget=$(VSTarget)
                          /p:BuildNumber=${{ parameters.ptvsPackageVersion }}
                          /bl:$(Build.SourcesDirectory)\logs\BuildProduct.binlog'

  # The publish SBOM tasks have been removed because they are generated and published automatically by the pipeline
  # https://eng.ms/docs/cloud-ai-platform/devdiv/one-engineering-system-1es/1es-docs/1es-pipeline-templates/features/sbom
      # Non-PR steps
  - ${{ if notin(variables['Build.Reason'], 'PullRequest') }}:

    # Generate the bill of materials
    # This must be done AFTER building binaries, but BEFORE building the installer
    - task: AzureArtifacts.manifest-generator-task.manifest-generator-task.ManifestGeneratorTask@0
      displayName: 'Generate bill of materials'
      inputs:
        BuildDropPath: '$(Build.BinariesDirectory)\layout'
        PackageName: 'PTVS'
        PackageVersion: '$(VSTarget)'
      continueOnError: true

  # Build the tests (skip for PR builds since tests are not run in this pipeline)
  - task: MSBuild@1
    displayName: 'Build tests'
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    inputs:
      solution: $(Build.SourcesDirectory)/Python/Tests/dirs.proj
      msbuildVersion: $(MsBuildVersion)
      platform: $(Platform)
      configuration: $(BuildConfiguration)
      msbuildArguments: ' /p:VSTarget=$(VSTarget)
                          /p:BuildNumber=${{ parameters.ptvsPackageVersion }}
                          /bl:$(Build.SourcesDirectory)\logs\BuildTests.binlog'

  # Build the installer (skip for PR builds since no VstsDrop upload is needed)
  - task: MSBuild@1
    displayName: 'Build installer'
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    inputs:
      solution: $(Build.SourcesDirectory)/Python/Setup/dirs.proj
      msbuildVersion: $(MsBuildVersion)
      platform: $(Platform)
      configuration: $(BuildConfiguration)
      msbuildArguments: ' /p:SkipProduct=true
                          /p:VSTarget=$(VSTarget)
                          /p:BuildNumber=${{ parameters.ptvsPackageVersion }}
                          /p:BUILD_BINARIESDIRECTORY=$(Build.BinariesDirectory)
                          /p:BUILD_STAGINGDIRECTORY=$(Build.StagingDirectory)
                          /bl:$(Build.SourcesDirectory)\logs\BuildInstaller.binlog'

  - task: PowerShell@2
    displayName: 'Check packaged template fonts against signing output'
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    inputs:
      targetType: filePath
      filePath: '$(Build.SourcesDirectory)\Build\PrepareTemplateFontVerification.ps1'
      arguments: '-SetupPath "$(Build.BinariesDirectory)\raw\setup\swix" -TemplatePath "$(Build.BinariesDirectory)\raw\binaries\templates" -UnsignedTemplatePath "$(Build.BinariesDirectory)\raw\unsigned\templates" -VerificationPath "$(Agent.TempDirectory)\PTVS-TemplateFontVerification-$(Build.BuildId)"'

  - task: MicroBuildCodesignVerify@3
    displayName: 'Verify packaged template font signatures'
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    inputs:
      TargetFolders: '$(Agent.TempDirectory)\PTVS-TemplateFontVerification-$(Build.BuildId)'
      # Match insertion SignCheck's BinInspect /3p policy instead of warning on non-Microsoft signatures.
      FailOnMissing1PSignature: true

  - task: NuGetAuthenticate@1
    displayName: 'NuGet Authenticate (BinInspect)'
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

  - task: NuGetCommand@2
    displayName: 'Install BinInspectToolSet 1.0.26082603'
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    inputs:
      command: custom
      arguments: 'install BinInspectToolSet -Version 1.0.26082603 -DependencyVersion Ignore -ExcludeVersion -Source "https://devdiv.pkgs.visualstudio.com/_packaging/VS-CoreXtFeeds/nuget/v3/index.json" -OutputDirectory "$(Agent.TempDirectory)\PTVS-CatalogDiagnosticVerifier-$(Build.BuildId)" -NonInteractive'

  - task: MSBuild@1
    displayName: 'Generate diagnostic template font catalog'
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    inputs:
      solution: $(Build.SourcesDirectory)\Python\Setup\signfontcatalogdiagnostic.proj
      msbuildVersion: $(MsBuildVersion)
      platform: $(Platform)
      configuration: $(BuildConfiguration)
      msbuildArguments: ' /p:VSTarget=$(VSTarget)
                          /p:BuildNumber=${{ parameters.ptvsPackageVersion }}
                          /p:BUILD_BINARIESDIRECTORY=$(Build.BinariesDirectory)
                          /p:BUILD_STAGINGDIRECTORY=$(Build.StagingDirectory)
                          /p:TemplateFontVerificationPath=$(Agent.TempDirectory)\PTVS-TemplateFontVerification-$(Build.BuildId)
                          /p:TemplateFontOriginalPath=$(Build.SourcesDirectory)\logs\TemplateFontCatalogDiagnostic\packaged-fonts
                          /bl:$(Build.SourcesDirectory)\logs\BuildTemplateFontCatalogDiagnostic.binlog'

  - task: PowerShell@2
    displayName: 'Test template font catalog insertion'
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    inputs:
      targetType: filePath
      filePath: '$(Build.SourcesDirectory)\Build\TestTemplateFontCatalogForInsertion.ps1'
      arguments: '-VerificationPath "$(Agent.TempDirectory)\PTVS-TemplateFontVerification-$(Build.BuildId)" -OriginalFontPath "$(Build.SourcesDirectory)\logs\TemplateFontCatalogDiagnostic\packaged-fonts" -BinInspectPath "$(Agent.TempDirectory)\PTVS-CatalogDiagnosticVerifier-$(Build.BuildId)\BinInspectToolSet\tools\BinInspect.exe" -ReportPath "$(Build.SourcesDirectory)\logs\TemplateFontCatalogDiagnostic"'

  - task: PowerShell@2
    displayName: 'Clean up extracted template fonts'
    condition: and(always(), ne(variables['Build.Reason'], 'PullRequest'))
    inputs:
      targetType: inline
      script: |
        $paths = @(
          '$(Agent.TempDirectory)\PTVS-TemplateFontVerification-$(Build.BuildId)',
          '$(Agent.TempDirectory)\PTVS-CatalogDiagnosticVerifier-$(Build.BuildId)'
        )
        foreach ($path in $paths) {
          if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Recurse -Force
          }
        }
