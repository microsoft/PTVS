parameters:
- name: ptvsPackageVersion
  type: string
  default: $(Build.BuildNumber)

steps:

  - task: PowerShell@2
    displayName: 'Validate template assets'
    inputs:
      targetType: filePath
      filePath: '$(Build.SourcesDirectory)\Build\ValidateTemplateAssets.ps1'
      arguments: '-TemplateRoot "$(Build.SourcesDirectory)\Python\Templates" -DocumentationPath "$(Build.SourcesDirectory)\Python\Templates\README.md"'

  # Build the product
  - task: MSBuild@1
    displayName: 'Build product'
    inputs:
      solution: $(Build.SourcesDirectory)/Python/Product/dirs.proj
      msbuildVersion: $(MsBuildVersion)
      platform: $(Platform)
      configuration: $(BuildConfiguration)
      msbuildArguments: ' /p:VSTarget=$(VSTarget) 
                          /p:BuildNumber=${{ parameters.ptvsPackageVersion }} 
                          /bl:$(Build.SourcesDirectory)\logs\BuildProduct.binlog'

  - task: PowerShell@2
    displayName: 'Validate VC debugger launcher VSIX'
    inputs:
      targetType: filePath
      filePath: '$(Build.SourcesDirectory)\Build\ValidateVCDebugLauncherVsix.ps1'
      arguments: '-VsixPath "$(Build.BinariesDirectory)\raw\setup\Microsoft.PythonTools.Debugger.VCLauncher.vsix" -VSTarget "$(VSTarget)"'

  - task: MSBuild@1
    displayName: 'Build localized VC debugger launcher content'
    condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'))
    inputs:
      solution: $(Build.SourcesDirectory)/Python/Setup/loclayout.proj
      msbuildVersion: $(MsBuildVersion)
      platform: $(Platform)
      configuration: $(BuildConfiguration)
      msbuildArguments: ' /p:VSTarget=$(VSTarget)
                          /p:BuildNumber=${{ parameters.ptvsPackageVersion }}
                          /p:BUILD_BINARIESDIRECTORY=$(Build.BinariesDirectory)
                          /bl:$(Build.SourcesDirectory)\logs\BuildVCDebugLauncherLocalization.binlog'

  - task: MSBuild@1
    displayName: 'Rebuild localized VC debugger launcher VSIX'
    condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'))
    inputs:
      solution: $(Build.SourcesDirectory)/Python/Setup/vsix.proj
      msbuildVersion: $(MsBuildVersion)
      platform: $(Platform)
      configuration: $(BuildConfiguration)
      msbuildArguments: ' /p:VSTarget=$(VSTarget)
                          /p:BuildNumber=${{ parameters.ptvsPackageVersion }}
                          /p:BUILD_BINARIESDIRECTORY=$(Build.BinariesDirectory)
                          /bl:$(Build.SourcesDirectory)\logs\BuildVCDebugLauncherVsix.binlog'

  - task: PowerShell@2
    displayName: 'Validate localized VC debugger launcher VSIX for PR'
    condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'))
    inputs:
      targetType: filePath
      filePath: '$(Build.SourcesDirectory)\Build\ValidateVCDebugLauncherVsix.ps1'
      arguments: '-VsixPath "$(Build.BinariesDirectory)\raw\setup\Microsoft.PythonTools.Debugger.VCLauncher.vsix" -VSTarget "$(VSTarget)" -RequireLocalizedContent'

  # The publish SBOM tasks have been removed because they are generated and published automatically by the pipeline
  # https://eng.ms/docs/cloud-ai-platform/devdiv/one-engineering-system-1es/1es-docs/1es-pipeline-templates/features/sbom
      # Non-PR steps
  - ${{ if notin(variables['Build.Reason'], 'PullRequest') }}:

    # Generate the bill of materials
    # This must be done AFTER building binaries, but BEFORE building the installer
    - task: AzureArtifacts.manifest-generator-task.manifest-generator-task.ManifestGeneratorTask@0
      displayName: 'Generate bill of materials'
      inputs:
        BuildDropPath: '$(Build.BinariesDirectory)\layout'
        PackageName: 'PTVS'
        PackageVersion: '$(VSTarget)'
      continueOnError: true

  # Build the tests (skip for PR builds since tests are not run in this pipeline)
  - task: MSBuild@1
    displayName: 'Build tests'
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    inputs:
      solution: $(Build.SourcesDirectory)/Python/Tests/dirs.proj
      msbuildVersion: $(MsBuildVersion)
      platform: $(Platform)
      configuration: $(BuildConfiguration)
      msbuildArguments: ' /p:VSTarget=$(VSTarget) 
                          /p:BuildNumber=${{ parameters.ptvsPackageVersion }} 
                          /bl:$(Build.SourcesDirectory)\logs\BuildTests.binlog'

  # Build the installer (skip for PR builds since no VstsDrop upload is needed)
  - task: MSBuild@1
    displayName: 'Build installer'
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    inputs:
      solution: $(Build.SourcesDirectory)/Python/Setup/dirs.proj
      msbuildVersion: $(MsBuildVersion)
      platform: $(Platform)
      configuration: $(BuildConfiguration)
      msbuildArguments: ' /p:SkipProduct=true 
                          /p:VSTarget=$(VSTarget) 
                          /p:BuildNumber=${{ parameters.ptvsPackageVersion }} 
                          /p:BUILD_BINARIESDIRECTORY=$(Build.BinariesDirectory)
                          /p:BUILD_STAGINGDIRECTORY=$(Build.StagingDirectory) 
                          /bl:$(Build.SourcesDirectory)\logs\BuildInstaller.binlog'

  - task: PowerShell@2
    displayName: 'Validate localized VC debugger launcher VSIX'
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    inputs:
      targetType: filePath
      filePath: '$(Build.SourcesDirectory)\Build\ValidateVCDebugLauncherVsix.ps1'
      arguments: '-VsixPath "$(Build.BinariesDirectory)\raw\setup\Microsoft.PythonTools.Debugger.VCLauncher.vsix" -VSTarget "$(VSTarget)" -RequireLocalizedContent'
